<VirtualHost *:80>
    ServerName portal.local
    ServerAlias www.portal.local
    DocumentRoot /var/www/portal.local/public

    <Directory /var/www/portal.local/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/portal.local_error.log
    CustomLog ${APACHE_LOG_DIR}/portal.local_access.log combined

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName portal.local
    ServerAlias www.portal.local
    DocumentRoot /var/www/portal.local/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/local-certificates/portal.local.crt
    SSLCertificateKeyFile /etc/ssl/local-certificates/portal.local.key

    <Directory /var/www/portal.local/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/portal.local_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/portal.local_ssl_access.log combined
</VirtualHost>
